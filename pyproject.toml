[project]
name = "cascudo"
version = "0.1.0"
description = "Cascudo — peixe cascudo que varre o fundo do código. Mapa mental 0 IA, fluxograma + dead/cycle + padrões determinísticos."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "redis>=5.0",
  "rq>=1.16",
  "tree-sitter>=0.22",
  "tree-sitter-languages>=1.10.2",
  "networkx>=3.3",
  "python-multipart>=0.0.9",
  "boto3>=1.34",
  "structlog>=24.1",
  "python-jose[cryptography]>=3.3",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.5",
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-benchmark>=4.0",
  "hypothesis>=6.100",
  "httpx>=0.27",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E","F","I","UP","B","C4","SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["cascudo_core", "app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
