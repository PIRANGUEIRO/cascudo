services:
  - type: web
    name: cascudo-api
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -e .
    startCommand: uvicorn app.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: DEFAULT_WORKSPACE
        value: ws-demo
